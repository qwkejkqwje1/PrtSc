[package]
name = "luma-shot"
version = "1.2.0"
edition = "2021"
rust-version = "1.82"
description = "Local-first, native screenshot and visual search utility"
license = "MIT"
default-run = "PrtSc"

[dependencies]
base64 = "0.22"
fontdue = "0.9"
gif = "0.13"
image-webp = "0.2"
jpeg-encoder = "0.6"
png = "0.17"
quircs = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_ProcessStatus",
  "Win32_System_Com", "Win32_System_Registry", "Win32_Security_Credentials", "Win32_Security_Cryptography",
  "Win32_Networking_WinHttp", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_Storage_Xps"
] }
windows = { version = "0.58", features = ["Foundation", "Globalization", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Win32_Media_MediaFoundation", "Win32_System_Com"] }

[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[[bin]]
name = "PrtSc"
path = "src/main.rs"
